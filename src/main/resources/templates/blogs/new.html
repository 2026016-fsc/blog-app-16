<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('55ch - 新規スレ立て')}"></head>
  <body>
    <main class="container">
      <h1>新規スレ立て（新規投稿）</h1>

      <form th:action="@{/blogs/create}" method="post">
        <div>
          <label>お名前：</label><br />
          <input type="text" name="name" th:value="${defaultName}" required />
        </div>
        <br />

        <div>
          <label>スレッドタイトル：</label><br />
          <input
            type="text"
            name="title"
            placeholder="タイトルを入力"
            required
            style="width: 300px"
          />
        </div>
        <br />

        <div>
          <label>本文（1レス目）：</label><br />
          <textarea
            name="article"
            placeholder="ここに本文を書く"
            rows="5"
            cols="40"
            required
          ></textarea>
        </div>
        <br />

        <button type="submit">スレッドを立てる</button>
      </form>

      <br />
      <a th:href="@{/}">戻る</a>
    </main>
  </body>
</html>
