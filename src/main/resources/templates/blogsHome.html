<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('55ch')}">
    <title>55ch</title>
  </head>
  <body>
    <header class="site-header">
      <a href="/"><h1>55ch</h1></a>
      <nav class="site-nav">
        <ul>
          <li><a th:href="@{/}">ホーム</a></li>
          <li><a th:href="@{/Nullpo}">私たちについて</a></li>
          <li><a th:href="@{/Nullpo}">サービス</a></li>
          <li><a th:href="@{/Nullpo}">お問い合わせ</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">
      <h1>ブログ記事一覧</h1>

      <form class="form" action="/blogsHome" method="get">
        <input type="text" name="keyword" />
        <button type="submit">検索</button>
      </form>

      <div>
        <a th:href="@{/blogs/new}" class="new-thred-fixed">新規スレ立て</a>
      </div>

      <p th:if="${#lists.isEmpty(blogs)}">記事がまだ投稿されていません。</p>

      <div class="blog-list" th:if="${not #lists.isEmpty(blogs)}">
        <article th:each="blog : ${blogs}" class="blog-item">
          <a th:href="@{/blogs/{id}(id=${blog.id})}">
            <h2 class="blog-title" th:text="${blog.title}">記事のタイトル</h2>
          </a>

          <p
            class="blog-content"
            th:text="${#strings.abbreviate(blog.article, 50)}"
          ></p>

          <span
            class="blog-time"
            th:text="${#temporals.format(blog.postTime, 'yyyy/MM/dd HH:mm')}"
          >
          </span>
        </article>
      </div>
    </main>
  </body>
</html>
